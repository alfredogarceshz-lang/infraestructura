name: Terraform Apply

on:
  push:
    branches: [develop, qa, prod]
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Block apply outside protected branches
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" != "develop" ] && [ "$BRANCH" != "qa" ] && [ "$BRANCH" != "prod" ]; then
            echo "Apply is blocked for branch: $BRANCH"
            exit 1
          fi

      - name: Resolve environment path from branch
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "develop" ]; then echo "ENV_DIR=environments/dev" >> $GITHUB_ENV; fi
          if [ "$BRANCH" = "qa" ]; then echo "ENV_DIR=environments/qa" >> $GITHUB_ENV; fi
          if [ "$BRANCH" = "prod" ]; then echo "ENV_DIR=environments/prod" >> $GITHUB_ENV; fi

      - name: Terraform init
        working-directory: terraform-gcp/${{ env.ENV_DIR }}
        run: |
          terraform init -backend-config="bucket=${{ vars.TFSTATE_BUCKET }}" -backend-config="prefix=${{ env.ENV_DIR }}"

      - name: Terraform apply
        working-directory: terraform-gcp/${{ env.ENV_DIR }}
        run: terraform apply -var-file=terraform.tfvars -auto-approve -input=false
